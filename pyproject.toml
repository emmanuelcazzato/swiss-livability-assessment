[project]
name = "swiss-livability-assessment"
version = "0.1.0"
description = "Swiss Residential Perceived Livability Assessment using Fuzzy Inference System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0.0",
    "flask-babel>=4.0.0",
    "geopandas>=0.13.0",
    "jupyter>=1.0.0",
    "matplotlib>=3.7.0",
    "networkx>=3.5",
    "numpy>=1.24.0",
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
    "scikit-fuzzy>=0.4.2",
    "scipy>=1.10.0",
    "seaborn>=0.12.0",
]

[project.scripts]
run-webapp = "app.web_app:main"
run-prototype = "scripts.run_prototype:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "app"]
